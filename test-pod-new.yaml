apiVersion: v1
kind: Pod
metadata:
  name: tabformer-a100-pod
  namespace: rlvr
  labels:
    app: tabformer-training
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-tesla-a100
  tolerations:
  - key: cloud.google.com/gke-spot
    operator: Exists
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: systalyze.com/spot
    operator: Exists
    effect: NoSchedule
  containers:
  - name: pytorch
    image: nvcr.io/nvidia/pytorch:24.08-py3
    securityContext:
      capabilities:
        add:
          - SYS_ADMIN
    command: ["/bin/bash"]
    args:
    - "-c"
    - |
      set -e
      echo "Installing tmux and wget..."
      apt-get update && apt-get install -y tmux wget
      echo "tmux installed successfully!"

      # Install DCGM
      echo "Installing DCGM..."
      distribution="ubuntu2204"
      if ! wget https://developer.download.nvidia.com/compute/cuda/repos/$distribution/x86_64/cuda-keyring_1.1-1_all.deb; then
        echo "WARNING: Failed to download CUDA keyring, skipping DCGM installation"
      else
        if dpkg -i cuda-keyring_1.1-1_all.deb && apt-get update; then
          if apt-get install -y datacenter-gpu-manager; then
            echo "Starting nv-hostengine in daemon mode..."
            nv-hostengine || echo "WARNING: Failed to start nv-hostengine"
            sleep 3
            echo "DCGM installed successfully"
          else
            echo "WARNING: Failed to install datacenter-gpu-manager"
          fi
        else
          echo "WARNING: Failed to configure CUDA repos"
        fi
      fi

      echo "Installing Python packages for TabFormer..."
      pip install transformers scikit-learn pandas tqdm
      echo "TabFormer dependencies installed successfully!"

      # Clone TabFormer repository (from your fork with updated code)
      echo "Cloning TabFormer repository..."
      cd /workspace
      if [ -d "TabFormer" ]; then
        echo "TabFormer directory already exists, pulling latest changes..."
        cd TabFormer
        git pull origin main
      else
        git clone https://github.com/tianxiao-commits/TabFormer.git TabFormer
        cd TabFormer
        echo "TabFormer cloned successfully!"
      fi

      # Set wandb API key
      echo "Configuring wandb..."
      export WANDB_API_KEY=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
      echo "export WANDB_API_KEY=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" >> ~/.bashrc
      echo "wandb configured successfully!"

      echo "Installing Claude Code..."
      curl -fsSL https://claude.ai/install.sh | bash
      echo "Claude Code installed successfully!"

      echo "==================================="
      echo "TabFormer environment ready (NEW - Latest Transformers)!"
      echo "GPU: 1x NVIDIA A100 (40GB)"
      echo "Dataset location: /workspace/TabFormer/data/credit_card/"
      echo ""
      echo "Inference benchmark commands (uses random weights - no training needed):"
      echo "cd /workspace/TabFormer"
      echo ""
      echo "# Comprehensive benchmark sweep (RECOMMENDED):"
      echo "# Benchmarks both BERT and GPT2 with 120M (16 layers) and 20M (4 layers) configs"
      echo "# Sweeps batch sizes: 1, 4, 16, 32 and sequence lengths: 10, 50, 100"
      echo "python benchmark_sweep.py --model_types bert,gpt2 --config_names 120M,20M --batch_sizes 1,4,16,32 --seq_lens 10,50,100 --num_iterations 100"
      echo ""
      echo "# Quick test (fewer iterations):"
      echo "python benchmark_sweep.py --num_iterations 20"
      echo ""
      echo "# Benchmark specific model only:"
      echo "python benchmark_sweep.py --model_types bert --config_names 120M --batch_sizes 1,16,32 --seq_lens 50,100"
      echo ""
      echo "# View model configs:"
      echo "python model_configs.py"
      echo ""
      echo "Example training command (optional - for actual model training):"
      echo "python main.py --do_train --mlm --field_ce --lm_type bert --field_hs 64 --data_type card --nrows 100000 --num_train_epochs 3 --output_dir ./checkpoints/a100_model"
      echo "==================================="
      echo "Keeping pod alive. Connect and run commands manually..."
      sleep infinity
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        memory: "32Gi"
        cpu: "8"
        nvidia.com/gpu: "1"
    env:
    - name: HF_HOME
      value: "/workspace/models"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: dshm
      mountPath: /dev/shm
    - name: models-cache
      mountPath: /workspace/models
  volumes:
  - name: workspace
    emptyDir:
      sizeLimit: 100Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
  - name: models-cache
    emptyDir:
      sizeLimit: 50Gi
