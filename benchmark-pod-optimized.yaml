apiVersion: v1
kind: Pod
metadata:
  name: tabformer-optimized-a100
  namespace: rlvr
  labels:
    app: tabformer-optimized
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-tesla-a100
  tolerations:
  - key: cloud.google.com/gke-spot
    operator: Exists
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: systalyze.com/spot
    operator: Exists
    effect: NoSchedule
  containers:
  - name: pytorch
    image: nvcr.io/nvidia/pytorch:24.08-py3
    securityContext:
      privileged: true
    command: ["/bin/bash"]
    args:
    - "-c"
    - |
      set -e

      # Set up logging
      LOG_FILE="/workspace/benchmark_$(date +%Y%m%d_%H%M%S).log"
      exec > >(tee -a "$LOG_FILE") 2>&1

      echo "=========================================="
      echo "TabFormer Optimized-Only Benchmark"
      echo "Started at: $(date)"
      echo "Log file: $LOG_FILE"
      echo "=========================================="

      echo "Installing dependencies..."
      apt-get update && apt-get install -y tmux wget git
      pip install transformers scikit-learn pandas tqdm

      # Clone TabFormer repository
      echo "Cloning TabFormer repository..."
      cd /workspace
      if [ -d "TabFormer" ]; then
        echo "TabFormer directory exists, pulling latest..."
        cd TabFormer
        git pull origin main
      else
        git clone https://github.com/tianxiao-commits/TabFormer.git TabFormer
        cd TabFormer
      fi

      echo "=========================================="
      echo "TabFormer Optimized Benchmark - BF16"
      echo "=========================================="
      echo "GPU: NVIDIA A100"
      echo "Model configurations:"
      echo "  20M:  seq_lengths = [32, 64, 128, 256]"
      echo "  120M: seq_lengths = [32, 64]"
      echo "  720M: seq_lengths = [16]"
      echo "Batch size strategy: Binary search (1-128)"
      echo "  - Always measure batch_size=1"
      echo "  - Binary search for each SLA separately"
      echo "Warmup iterations: 20 (for CUDA graph capture)"
      echo "Benchmark iterations: 50 (mean, median, std)"
      echo "SLA targets: 5ms, 10ms, 15ms"
      echo "Precision: BF16"
      echo "Optimization: torch.compile(fullgraph=True, mode='reduce-overhead')"
      echo "Per-config recompilation: Enabled"
      echo "=========================================="

      # Run optimized benchmark with BF16
      echo "Running BF16 optimized benchmark..."
      python benchmark_tabformer_optimized_only.py \
        --precision bf16 \
        --device cuda

      echo "=========================================="
      echo "Benchmark Complete!"
      echo "Finished at: $(date)"
      echo "Results saved to:"
      echo "  JSON: /workspace/bf16_optimized_results.json"
      echo "  JSONL: /workspace/bf16_optimized_results_raw.jsonl"
      echo "  Log: $LOG_FILE"
      echo "Results are persisted in PVC: tabformer-benchmark-data"
      echo "=========================================="

    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        memory: "64Gi"
        cpu: "16"
        nvidia.com/gpu: "1"
    env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
    - name: PYTHONUNBUFFERED
      value: "1"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: tabformer-benchmark-data
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
