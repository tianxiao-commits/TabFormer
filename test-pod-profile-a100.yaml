apiVersion: v1
kind: Pod
metadata:
  name: tabformer-profile-test
  namespace: rlvr
  labels:
    app: tabformer-profile
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-tesla-a100
  tolerations:
  - key: cloud.google.com/gke-spot
    operator: Exists
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: systalyze.com/spot
    operator: Exists
    effect: NoSchedule
  containers:
  - name: pytorch
    image: nvcr.io/nvidia/pytorch:24.08-py3
    securityContext:
      privileged: true
    command: ["/bin/bash"]
    args:
    - "-c"
    - |
      set -e
      echo "=========================================="
      echo "TabFormer CUDA Graph Profile Test"
      echo "=========================================="

      echo "Installing dependencies..."
      apt-get update && apt-get install -y tmux wget git
      pip install transformers scikit-learn pandas tqdm

      # Clone TabFormer repository
      echo "Cloning TabFormer repository..."
      cd /workspace
      if [ -d "TabFormer" ]; then
        echo "TabFormer directory exists, pulling latest..."
        cd TabFormer
        git pull origin main
      else
        git clone https://github.com/tianxiao-commits/TabFormer.git TabFormer
        cd TabFormer
      fi

      echo "=========================================="
      echo "Test Configuration"
      echo "=========================================="
      echo "Model: 20M TabFormer"
      echo "Batch size: 8"
      echo "Sequence length: 128"
      echo "Precision: BF16"
      echo "Warmup: 20 iterations"
      echo "Benchmark: 50 iterations"
      echo "=========================================="

      # Profile baseline (no compile)
      echo ""
      echo "[1/2] Profiling BASELINE (no torch.compile)..."
      nsys profile \
        -o /workspace/tabformer_baseline_profile \
        --stats=true \
        --force-overwrite=true \
        python test_baseline.py

      echo ""
      echo "[2/2] Profiling OPTIMIZED (torch.compile + CUDA graphs)..."
      nsys profile \
        -o /workspace/tabformer_optimized_profile \
        --stats=true \
        --force-overwrite=true \
        python test_optimized.py

      echo ""
      echo "=========================================="
      echo "Profiling Complete!"
      echo "=========================================="
      echo "Profiles saved to:"
      echo "  Baseline:  /workspace/tabformer_baseline_profile.nsys-rep"
      echo "  Optimized: /workspace/tabformer_optimized_profile.nsys-rep"
      echo ""
      echo "To copy profiles to local machine:"
      echo "  kubectl cp rlvr/tabformer-profile-test:/workspace/tabformer_baseline_profile.nsys-rep ./baseline_profile.nsys-rep"
      echo "  kubectl cp rlvr/tabformer-profile-test:/workspace/tabformer_optimized_profile.nsys-rep ./optimized_profile.nsys-rep"
      echo "=========================================="

      # Keep pod alive for result inspection
      echo "Keeping pod alive for profile retrieval..."
      sleep infinity

    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        memory: "64Gi"
        cpu: "16"
        nvidia.com/gpu: "1"
    env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
    - name: PYTHONUNBUFFERED
      value: "1"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: workspace
    emptyDir:
      sizeLimit: 100Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
