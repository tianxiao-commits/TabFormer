apiVersion: v1
kind: Pod
metadata:
  name: tabformer-baseline-a100
  namespace: rlvr
  labels:
    app: tabformer-baseline
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-tesla-a100
  tolerations:
  - key: cloud.google.com/gke-spot
    operator: Exists
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: systalyze.com/spot
    operator: Exists
    effect: NoSchedule
  containers:
  - name: pytorch
    image: nvcr.io/nvidia/pytorch:24.08-py3
    securityContext:
      privileged: true
    command: ["/bin/bash"]
    args:
    - "-c"
    - |
      set -e

      # Set up logging
      LOG_FILE="/workspace/benchmark_baseline_$(date +%Y%m%d_%H%M%S).log"
      exec > >(tee -a "$LOG_FILE") 2>&1

      echo "=========================================="
      echo "TabFormer Baseline-Only Benchmark"
      echo "Started at: $(date)"
      echo "Log file: $LOG_FILE"
      echo "=========================================="

      echo "Installing dependencies..."
      apt-get update && apt-get install -y tmux wget git
      pip install transformers scikit-learn pandas tqdm openpyxl

      # Clone TabFormer repository
      echo "Cloning TabFormer repository..."
      cd /workspace
      if [ -d "TabFormer" ]; then
        echo "TabFormer directory exists, pulling latest..."
        cd TabFormer
        git pull origin main
      else
        git clone https://github.com/tianxiao-commits/TabFormer.git TabFormer
        cd TabFormer
      fi

      echo "=========================================="
      echo "TabFormer Baseline Benchmark - BF16"
      echo "=========================================="
      echo "GPU: NVIDIA A100"
      echo "Configs: 20M, 120M, 720M"
      echo "Sequence lengths: 32, 64, 128, 256, 512, 1024"
      echo "Batch size progression: 1, 2, 3, 4, 6, 8, 10, 12, 14, 16, 20, 24, 28, 32, 40, 48, 56, 64, 80, 96..."
      echo "Warmup iterations: 5"
      echo "Benchmark iterations: 50"
      echo "SLA targets: 5ms, 10ms, 15ms"
      echo "Precision: BF16"
      echo "Testing: Baseline only (no torch.compile)"
      echo "=========================================="

      # Run baseline-only benchmark
      echo "Running BF16 baseline-only benchmark..."
      # Check if optimized results xlsx exists to append to
      if [ -f "/workspace/bf16_optimized_results_raw.xlsx" ]; then
        echo "Found existing optimized results, will append baseline results"
        python benchmark_tabformer_baseline_only.py \
          --xlsx /workspace/bf16_optimized_results_raw.xlsx \
          --device cuda
      else
        echo "ERROR: No existing optimized results found!"
        echo "Please copy bf16_optimized_results_raw.xlsx to PVC first"
        exit 1
      fi

      echo "=========================================="
      echo "Benchmark Complete!"
      echo "Finished at: $(date)"
      echo "Results saved to:"
      echo "  XLSX (appended): /workspace/bf16_optimized_results_raw.xlsx"
      echo "  Log: $LOG_FILE"
      echo "Results are persisted in PVC: tabformer-benchmark-data"
      echo "=========================================="

    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        memory: "64Gi"
        cpu: "16"
        nvidia.com/gpu: "1"
    env:
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
    - name: PYTHONUNBUFFERED
      value: "1"
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: tabformer-benchmark-data
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
